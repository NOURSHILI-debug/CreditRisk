[project]
name = "credit-risk-intelligence-platform"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=1.1.0",
    "scikit-learn==1.6.1",
    "xgboost==3.2.0",
    "joblib>=1.3.0",
    "matplotlib==3.11.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "confluent-kafka>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
